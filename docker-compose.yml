services:
  db_v2:
    image: postgres:15-alpine
    container_name: postgres_app_v2
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-devops_v2_db}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend_v2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_app_v2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db_v2:5432/${POSTGRES_DB:-devops_v2_db}
      AUTH_DEFAULT_USERNAME: ${AUTH_DEFAULT_USERNAME:-admin}
      AUTH_DEFAULT_PASSWORD: ${AUTH_DEFAULT_PASSWORD:-1234}
      OPENSEARCH_ENABLED: "true"
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_SCHEME: http
      OPENSEARCH_USER: ${OPENSEARCH_USER:-}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-}
      OPENSEARCH_INDEX: logs-app-v2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-admin_secret_key_123}
      JWT_ISSUER: ${JWT_ISSUER:-agrotech-enterprise}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-agrotech-api}
    depends_on:
      db_v2:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    volumes:
      - ./:/app
    networks:
      default:
        aliases:
          - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/metrics').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend_v2:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: streamlit_app_v2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8502:8501"
    environment:
      API_BASE_URL: http://backend_v2:8000
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      backend_v2:
        condition: service_healthy
    volumes:
      - ./:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: db_v2:5432/${POSTGRES_DB:-devops_v2_db}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-postgres}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      db_v2:
        condition: service_healthy
    expose:
      - "9187"

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--enable-feature=remote-write-receiver"
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend_v2:
        condition: service_healthy
      postgres-exporter:
        condition: service_started

  k6:
    image: grafana/k6:latest
    profiles:
      - k6
    environment:
      API_BASE: ${API_BASE:-http://backend:8000}
      K6_OUT: experimental-prometheus-rw
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s
    volumes:
      - ./k6:/scripts:ro
    command: run /scripts/test_basico.js
    depends_on:
      backend_v2:
        condition: service_healthy
      prometheus:
        condition: service_started

  opensearch:
    image: opensearchproject/opensearch:2
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9201:9200"
    expose:
      - "9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "127.0.0.1:5602:5601"
    depends_on:
      opensearch:
        condition: service_started

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning/:/etc/grafana/provisioning/:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

volumes:
  pgdata_v2:
  prometheus_data:
  grafana_data:
