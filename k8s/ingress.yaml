apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agrotech
  namespace: app
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - agrotech.example.com
        - api.agrotech.example.com
        - grafana.agrotech.example.com
      secretName: agrotech-tls
  rules:
    - host: agrotech.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8501
    - host: api.agrotech.example.com
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /items
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
    - host: grafana.agrotech.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
