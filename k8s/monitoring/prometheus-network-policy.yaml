apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-internal-clients
  namespace: app
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grafana
        - podSelector:
            matchLabels:
              app: k6
        - podSelector:
            matchLabels:
              app: backend
        - podSelector:
            matchLabels:
              app: postgres-exporter
      ports:
        - protocol: TCP
          port: 9090
