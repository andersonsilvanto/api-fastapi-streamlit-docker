apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: app
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: fastapi
        metrics_path: /metrics
        static_configs:
          - targets: ["backend:8000"]

      - job_name: postgres
        static_configs:
          - targets: ["postgres-exporter:9187"]
