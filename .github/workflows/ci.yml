name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            frontend/requirements.txt
            scripts/requirements.txt

      - name: Install dependencies and lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r frontend/requirements.txt -r scripts/requirements.txt flake8

      - name: Check Python syntax
        run: python -m compileall -q backend frontend scripts

      - name: Lint Python
        run: flake8 backend frontend scripts --max-line-length=120

      - name: Run automated tests when present
        run: |
          if [ -d tests ] && find tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            python -m pip install pytest
            python -m pytest -q
          else
            echo "No Python test suite found; skipping pytest."
          fi

  docker:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: Dockerfile
          - image: frontend
            dockerfile: Dockerfile.frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
